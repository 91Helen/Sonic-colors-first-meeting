            #sky {
                position: absolute;
                inset: 0;
                z-index: 1;
                pointer-events: none
            }

            .cl {
                position: absolute;
                left: 0;
                background: #fff;
                border-radius: 50%;
                filter: blur(8px)
            }

            #hud {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                padding: calc(10px + env(safe-area-inset-top,0px)) 16px 0;
                display: flex;
                align-items: center;
                gap: 14px;
                z-index: 9;
                font-size: 22px;
                font-weight: 700;
                color: #fff;
                text-shadow: 0 2px 0 rgba(0,0,0,.35)
            }

            #dots {
                display: flex;
                gap: 6px
            }

            .lb,.sb {
                font: inherit;
                font-weight: 700;
                font-size: 18px;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                border: 3px solid #fff;
                background: rgba(0,0,0,.28);
                color: #fff;
                cursor: pointer;
                padding: 0
            }

            .lb.done {
                background: #2dc75c
            }

            .lb.on {
                background: #ffd23f;
                color: #1a1a1a;
                transform: scale(1.12)
            }

            .sb {
                font-size: 20px
            }

            #lv {
                flex: 1;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis
            }

            @media(max-width: 560px) {
                #lv {
                    display:none
                }

                #hud {
                    justify-content: space-between
                }
            }

            #stage {
                position: absolute;
                inset: 0;
                z-index: 5;
                pointer-events: none
            }

            #sonic {
                position: absolute;
                left: 0;
                top: 0;
                width: min(34vw,240px);
                z-index: 8;
                pointer-events: none;
                filter: drop-shadow(0 14px 8px rgba(0,0,0,.3))
            }

            #sonic img {
                width: 100%;
                display: block;
                pointer-events: auto;
                cursor: pointer
            }

            #face {
                position: relative
            }

            #fsv {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                pointer-events: none
            }

            #bubble {
                position: absolute;
                top: calc(56px + env(safe-area-inset-top,0px));
                left: 0;
                right: 0;
                margin: auto;
                width: fit-content;
                max-width: 92vw;
                background: var(--card);
                border-radius: 28px;
                padding: 10px 24px 10px 12px;
                display: flex;
                align-items: center;
                gap: 12px;
                font-size: clamp(22px,4vw,34px);
                font-weight: 700;
                box-shadow: 0 8px 0 rgba(0,0,0,.2);
                z-index: 9;
                opacity: 0
            }

            .av {
                width: 56px;
                height: 56px;
                border-radius: 50%;
                object-fit: cover;
                flex: none
            }

            .b {
                position: absolute;
                left: 0;
                top: 0;
                width: 84px;
                height: 120px;
                cursor: pointer;
                pointer-events: auto
            }

            .b svg {
                width: 100%;
                height: 100%;
                display: block;
                overflow: visible;
                filter: drop-shadow(0 6px 4px rgba(0,0,0,.2))
            }

            .card {
                position: absolute;
                right: 4vw;
                bottom: calc(8vh + env(safe-area-inset-bottom,0px));
                pointer-events: auto;
                background: var(--card);
                border-radius: 28px;
                padding: 18px;
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
                align-items: center;
                box-shadow: 0 8px 0 rgba(0,0,0,.2)
            }

            .card.end {
                left: 0;
                right: 0;
                margin: auto;
                width: fit-content;
                bottom: auto;
                top: 30%;
                flex-direction: column;
                text-align: center;
                font-size: 34px
            }

            input {
                font: inherit;
                font-size: 24px;
                padding: 12px 16px;
                border: 3px solid #c6dcff;
                border-radius: 18px;
                width: min(60vw,260px);
                user-select: text;
                -webkit-user-select: text
            }

            .big {
                font: inherit;
                font-weight: 700;
                font-size: 26px;
                padding: 14px 28px;
                border: 0;
                border-radius: 22px;
                background: #ffd23f;
                color: #1a1a1a;
                box-shadow: 0 6px 0 #c99a00;
                cursor: pointer
            }

            .big:active {
                transform: translateY(4px);
                box-shadow: 0 2px 0 #c99a00
            }

            .chips {
                position: absolute;
                left: 0;
                right: 0;
                bottom: calc(9vh + env(safe-area-inset-bottom,0px));
                display: flex;
                justify-content: center;
                gap: 16px;
                pointer-events: none
            }

            .chip {
                pointer-events: auto;
                width: clamp(56px,13vw,92px);
                height: clamp(56px,13vw,92px);
                border: 0;
                background: none;
                padding: 0;
                cursor: pointer;
                filter: drop-shadow(0 6px 0 rgba(0,0,0,.2))
            }

            .chip svg {
                width: 100%;
                height: 100%;
                display: block
            }

            .pad {
                position: absolute;
                bottom: 4px;
                width: min(16%,100px);
                aspect-ratio: 1;
                pointer-events: auto;
                cursor: pointer;
                filter: drop-shadow(0 6px 0 rgba(0,0,0,.2))
            }

            .pad svg {
                width: 100%;
                height: 100%;
                display: block
            }

            .pad span {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: clamp(14px,2.6vw,22px);
                font-weight: 700;
                color: #fff;
                text-shadow: 0 2px 3px rgba(0,0,0,.6)
            }

            .lad {
                position: absolute;
                width: 62px;
                border-left: 7px solid #8a5a2b;
                border-right: 7px solid #8a5a2b;
                background: repeating-linear-gradient(to bottom,#8a5a2b 0 7px,transparent 7px 33px);
                pointer-events: auto;
                cursor: pointer;
                border-radius: 4px
            }

            #eyes {
                display: none;
                position: absolute;
                inset: 0;
                z-index: 6;
                font-size: min(30vw,220px);
                text-align: center;
                padding-top: 22vh
            }

            #fx,#cv {
                position: fixed;
                inset: 0;
                pointer-events: none
            }

            #fx {
                z-index: 10
            }

            #cv {
                z-index: 11
            }

            .ring {
                position: fixed;
                left: 0;
                top: 0;
                width: 34px;
                height: 34px;
                border: 7px solid #ffc800;
                border-radius: 50%
            }

            .w {
                position: fixed;
                left: 0;
                top: 0;
                font-size: 44px;
                font-weight: 700;
                white-space: nowrap;
                text-shadow: 0 0 6px #fff,0 0 6px #fff,2px 2px 0 #fff
            }

            #start {
                position: absolute;
                inset: 0;
                z-index: 20;
                background: rgba(20,70,40,.45);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                color: #fff;
                text-align: center;
                font-size: 30px
            }

            .credit {
                position: fixed;
                left: 12px;
                bottom: calc(6px + env(safe-area-inset-bottom,0px));
                z-index: 12;
                font-size: 14px;
                font-weight: 700;
                color: #fff;
                text-shadow: 0 1px 3px rgba(0,0,0,.8);
                pointer-events: none
            }

            #start .credit {
                position: static;
                font-size: 20px;
                margin-top: 8px
            }

            #start h1 {
                font-size: clamp(44px,10vw,90px)
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div id="bg"></div>
            <div id="sky"></div>
            <div id="hud">
                <div id="dots"></div>
                <span id="lv"></span>
                <span>
                    ⭐ <b id="st">0</b>
                </span>
                <button class="sb" id="snd" title="Sound on/off">🔊</button>
            </div>
            <div id="stage"></div>

            <div id="start">
                <h1>Hello, Sonic!</h1>

        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script>
            const $ = s => document.querySelector(s)
              , $$ = s => [...document.querySelectorAll(s)];
            const C = {
                red: "#ff4d4d",
                blue: "#3d8bff",
                green: "#2dc75c",
                yellow: "#ffd23f",
                orange: "#ff9a3d"
            }
              , N = Object.keys(C);
            const rnd = a => a[Math.random() * a.length | 0]
              , sh = a => [...a].sort( () => Math.random() - .5);
            const W = () => innerWidth
              , H = () => innerHeight
              , wait = ms => new Promise(r => setTimeout(r, ms))
              , rowX = i => W() * (.12 + i * .19) - 42;
            const T = ["Hello!", "Pop the balloons", "Touch the colour", "What’s missing?", "Run to the colour", "Climb!", "Bye-bye!"]
              , C2 = {
                grey: "#9aa0a6",
                black: "#2b2b2b",
                white: "#ffffff"
            }
              , N2 = Object.keys(C2);
            let st = 0, cur = 0, name = "friend", ac, alive = 0, fc = 1, sx = 0, sy = 0, muted = false, gi = 0;
            /* sound */
            const ctx = () => ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            function chirp(f1, f2, d=.12, type="sine", v=.12, at=0) {
                if (muted)
                    return;
                try {
                    const a = ctx()
                      , t = a.currentTime + at
                      , o = a.createOscillator()
                      , g = a.createGain();
                    o.type = type;
                    o.frequency.setValueAtTime(f1, t);
                    o.frequency.exponentialRampToValueAtTime(f2, t + d);
                    g.gain.setValueAtTime(v, t);
                    g.gain.exponentialRampToValueAtTime(.001, t + d);
                    o.connect(g);
                    g.connect(a.destination);
                    o.start(t);
                    o.stop(t + d)
                } catch (e) {}
            }
            const tone = (f, d=.12, t="sine") => chirp(f, f, d, t);
            function swoosh() {
                if (muted)
                    return;
                try {
                    const a = ctx()
                      , n = a.sampleRate * .5
                      , b = a.createBuffer(1, n, a.sampleRate)
                      , x = b.getChannelData(0);
                    for (let i = 0; i < n; i++)
                        x[i] = (Math.random() * 2 - 1) * (1 - i / n);
                    const s = a.createBufferSource()
                      , f = a.createBiquadFilter()
                      , g = a.createGain();
                    s.buffer = b;
                    f.type = "bandpass";
                    f.Q.value = 3;
                    f.frequency.setValueAtTime(300, a.currentTime);
                    f.frequency.exponentialRampToValueAtTime(3000, a.currentTime + .4);
                    g.gain.value = .5;
                    s.connect(f);
                    f.connect(g);
                    g.connect(a.destination);
                    s.start()
                } catch (e) {}
            }
            const jingle = () => [523, 659, 784, 1047].forEach( (f, i) => chirp(f, f, .2, "triangle", .12, i * .11));
            /* speech queue: nothing is cut off, newer lines replace only waiting ones */
            const q = [];
            let sp = false;
            function speak(t, show, flush) {
                return new Promise(res => {
                    if (flush)
                        q.splice(0).forEach(i => i.res());
                    q.push({
                        t,
                        show,
                        res
                    });
                    pump()
                }
                )
            }
            function bubble(t) {
                $("#bt").textContent = t;
                gsap.fromTo("#bubble", {
                    scale: .7,
                    opacity: 0
                }, {
                    scale: 1,
                    opacity: 1,
                    duration: .35,
                    ease: "back.out(2)"
                })
            }
            function pump() {
                if (sp || !q.length)
                    return;
                sp = true;
                const it = q.shift();
                if (it.show)
                    bubble(it.show);
                let d = 0;
                const fin = () => {
                    if (d)
                        return;
                    d = 1;
                    sp = false;
                    it.res();
                    pump()
                }
                ;
                setTimeout(fin, 1200 + it.t.length * 120);
                if (muted) {
                    setTimeout(fin, 400 + it.t.length * 55);
                    return
                }
                try {
                    const u = new SpeechSynthesisUtterance(it.t);
                    u.lang = "en-US";
                    u.rate = .8;
                    u.pitch = 1.3;
                    u.onend = fin;
                    u.onerror = fin;
                    speechSynthesis.speak(u)
                } catch (e) {
                    fin()
                }
            }
            const say = (t, s=t) => speak(s, t, true);
            /* confetti */
            const cv = $("#cv")
              , cx = cv.getContext("2d");
            let ps = []
              , raf = 0;
            const fit = () => {
                cv.width = W();
                cv.height = H()
            }
            ;
            fit();
            addEventListener("resize", fit);
            function boom(x, y, n=50) {
                for (let i = 0; i < n; i++)
                    ps.push({
                        x,
                        y,
                        vx: (Math.random() - .5) * 14,
                        vy: -Math.random() * 13 - 3,
                        r: 4 + Math.random() * 6,
                        c: C[rnd(N)],
                        l: 1,
                        a: Math.random() * 6
                    });
                if (!raf)
                    loop()
            }
            function loop() {
                cx.clearRect(0, 0, cv.width, cv.height);
                ps = ps.filter(p => p.l > 0);
                ps.forEach(p => {
                    p.vy += .45;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.l -= .012;
                    p.a += .2;
                    cx.globalAlpha = Math.max(p.l, 0);
                    cx.fillStyle = p.c;
                    cx.save();
                    cx.translate(p.x, p.y);
                    cx.rotate(p.a);
                    cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
                    cx.restore()
                }
                );
                raf = ps.length ? requestAnimationFrame(loop) : 0
            }
            /* Sonic */
            const S = $("#sonic")
              , F = $("#face")
              , I = $("#sonic img");
            let idle;
            gsap.set(S, {
                xPercent: -50,
                yPercent: -100
            });
            const bob = () => {
                idle && idle.kill();
                idle = gsap.to(I, {
                    y: -10,
                    duration: .45,
                    yoyo: true,
                    repeat: -1,
                    ease: "sine.inOut"
                })
            }
            ;
            bob();
            const put = (x, y) => {
                sx = x;
                sy = y;
                gsap.set(S, {
                    x,
                    y
                })
            }
            ;
            function ghost() {
                const r = I.getBoundingClientRect()
                  , g = I.cloneNode();
                Object.assign(g.style, {
                    position: "fixed",
                    left: r.left + "px",
                    top: r.top + "px",
                    width: r.width + "px",
                    opacity: .45,
                    transform: "scaleX(" + fc + ")"
                });
                $("#fx").appendChild(g);
                gsap.to(g, {
                    opacity: 0,
                    duration: .35,
                    onComplete: () => g.remove()
                })
            }
            function run(x, y, d=.9) {
                return new Promise(res => {
                    fc = x > sx ? -1 : 1;
                    gsap.to(F, {
                        scaleX: fc,
                        duration: .1
                    });
                    clearInterval(gi);
                    gi = setInterval(ghost, 60);
                    gsap.to(S, {
                        x,
                        y,
                        duration: d,
                        ease: "power2.inOut",
                        onComplete: () => {
                            clearInterval(gi);
                            sx = x;
                            sy = y;
                            res()
                        }
                    })
                }
                )
            }
            function jump() {
                gsap.killTweensOf(I);
                gsap.timeline({
                    onComplete: bob
                }).to(I, {
                    y: -140,
                    scaleY: 1.08,
                    duration: .28,
                    ease: "power2.out"
                }).to(I, {
                    y: 0,
                    scaleY: .88,
                    duration: .3,
                    ease: "bounce.out"
                }).to(I, {
                    scaleY: 1,
                    duration: .12
                })
            }
            /* living face: blinking, smile corners, laugh */
            gsap.set("#lidR", {
                scaleY: 0,
                svgOrigin: "337 189"
            });
            gsap.set("#lidL", {
                scaleY: 0,
                svgOrigin: "231 213"
            });
            gsap.set("#mo", {
                scaleY: 0,
                svgOrigin: "336 307"
            });
            gsap.set("#tkR", {
                svgOrigin: "364 293"
            });
            gsap.set("#tkL", {
                svgOrigin: "308 324"
            });
            function blink() {
                gsap.timeline().to(["#lidR", "#lidL"], {
                    scaleY: 1,
                    duration: .07
                }).to(["#lidR", "#lidL"], {
                    scaleY: 0,
                    duration: .1,
                    delay: .06
                })
            }
            (function nb() {
                setTimeout( () => {
                    blink();
                    if (Math.random() < .25)
                        setTimeout(blink, 280);
                    nb()
                }
                , 1800 + Math.random() * 3200)
            }
            )();
            function smile() {
                gsap.timeline().to("#tkR", {
                    scale: 1.8,
                    rotation: -16,
                    duration: .3,
                    yoyo: true,
                    repeat: 1
                }).to("#tkL", {
                    scale: 1.8,
                    rotation: 12,
                    duration: .3,
                    yoyo: true,
                    repeat: 1
                }, 0)
            }
            (function ns() {
                setTimeout( () => {
                    smile();
                    ns()
                }
                , 2200 + Math.random() * 2500)
            }
            )();
            const laugh = n => {
                gsap.to("#mo", {
                    scaleY: 1,
                    duration: .09,
                    yoyo: true,
                    repeat: n * 2 - 1
                });
                smile()
            }
            ;
            let rc = 0;
            function react() {
                const k = rc++ % 4
                  , r = I.getBoundingClientRect()
                  , cxp = r.left + r.width / 2;
                if (k === 0) {
                    [0, 1, 2, 3].forEach(i => chirp(900 + i * 40, 1250, .09, "triangle", .14, i * .13));
                    laugh(4);
                    gsap.fromTo(F, {
                        rotation: -8
                    }, {
                        rotation: 0,
                        duration: .7,
                        ease: "elastic.out(3,.2)"
                    });
                    word("Hee-hee!", cxp, r.top, "#ff6a00")
                } else if (k === 1) {
                    swoosh();
                    chirp(300, 900, .3, "sawtooth", .05);
                    const dx = (sx > W() / 2 ? -1 : 1) * 170;
                    run(sx + dx, sy, .22).then( () => run(sx - dx, sy, .22));
                    word("Whoosh!", cxp, r.top, "#1d6fd6")
                } else if (k === 2) {
                    chirp(280, 140, .15, "sawtooth", .1);
                    chirp(260, 120, .18, "sawtooth", .1, .19);
                    gsap.fromTo(F, {
                        scaleY: .78
                    }, {
                        scaleY: 1,
                        duration: .6,
                        ease: "elastic.out(2,.3)"
                    });
                    laugh(1);
                    word("Uhh!", cxp, r.top, "#c0392b")
                } else {
                    for (let i = 0; i < 6; i++)
                        chirp(i % 2 ? 1000 : 1350, i % 2 ? 1300 : 1000, .08, "triangle", .12, i * .1);
                    laugh(5);
                    gsap.fromTo(F, {
                        rotation: 8
                    }, {
                        rotation: 0,
                        duration: .8,
                        ease: "elastic.out(3,.2)"
                    });
                    word("Ha-ha-ha!", cxp, r.top, "#8e44ad")
                }
            }
            I.onpointerdown = react;
            const star = () => {
                st++;
                $("#st").textContent = st;
                gsap.fromTo("#st", {
                    scale: 1.8
                }, {
                    scale: 1,
                    duration: .4,
                    ease: "back.out(3)"
                });
                tone(880, .15)
            }
            ;
            function rings(x, y) {
                for (let i = 0; i < 7; i++) {
                    const r = document.createElement("i");
                    r.className = "ring";
                    $("#fx").appendChild(r);
                    gsap.fromTo(r, {
                        x,
                        y,
                        scale: .4,
                        opacity: 1
                    }, {
                        x: x + (Math.random() - .5) * 260,
                        y: y - 120 - Math.random() * 160,
                        scale: 1,
                        rotationY: 720,
                        opacity: 0,
                        duration: 1.1,
                        ease: "power2.out",
                        onComplete: () => r.remove()
                    })
                }
            }
            function word(t, x, y, c) {
                const w = document.createElement("div");
                w.className = "w";
                w.textContent = t;
                w.style.color = c;
                $("#fx").appendChild(w);
                gsap.set(w, {
                    xPercent: -50
                });
                gsap.fromTo(w, {
                    x,
                    y,
                    scale: .5,
                    opacity: 1
                }, {
                    y: y - 120,
                    scale: 1.3,
                    opacity: 0,
                    duration: 1.2,
                    ease: "power2.out",
                    onComplete: () => w.remove()
                })
            }
            const ball = c => '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="' + C[c] + '" stroke="#fff" stroke-width="4"/><path d="M10 38Q50 58 90 38M10 64Q50 84 90 64" stroke="#fff" stroke-opacity=".55" stroke-width="5" fill="none"/><ellipse cx="34" cy="27" rx="14" ry="8" fill="#fff" fill-opacity=".5" transform="rotate(-30 34 27)"/></svg>';
            const balloonSVG = c => '<svg viewBox="0 0 84 120"><path d="M42 3C20 3 5 21 5 44c0 24 18 44 37 50 19-6 37-26 37-50C79 21 64 3 42 3Z"' + (c === "white" ? ' stroke="#8a8a8a" stroke-width="3"' : "") + ' fill="' + (C[c] || C2[c]) + '"/><path d="M42 94l-8 11h16z" fill="' + (C[c] || C2[c]) + '"/><path d="M42 105q-6 8 0 15" stroke="#fff" stroke-opacity=".85" stroke-width="2" fill="none"/><path d="M60 80C70 68 76 56 76 44" stroke="#000" stroke-opacity=".12" stroke-width="8" fill="none" stroke-linecap="round"/><ellipse cx="27" cy="28" rx="9" ry="14" fill="#fff" fill-opacity=".5" transform="rotate(25 27 28)"/></svg>';
            function bl(c, x, y) {
                const b = document.createElement("div");
                b.className = "b";
                b.innerHTML = balloonSVG(c);
                $("#stage").appendChild(b);
                gsap.set(b, {
                    x,
                    y
                });
                return b
            }
            const shake = el => {
                tone(180, .2, "sawtooth");
                gsap.fromTo(el, {
                    rotation: -12
                }, {
                    rotation: 0,
                    duration: .5,
                    ease: "elastic.out(3,.3)"
                })
            }
            ;
            /* level menu and sound button */
            const D = $("#dots");
            for (let i = 0; i < 6; i++) {
                const b = document.createElement("button");
                b.className = "lb";
                b.textContent = i + 1;
                b.title = "Level " + (i + 1);
                b.onclick = () => go(i);
                D.appendChild(b)
            }
            $("#snd").onclick = () => {
                muted = !muted;
                $("#snd").textContent = muted ? "🔇" : "🔊";
                if (muted) {
                    try {
                        speechSynthesis.cancel()
                    } catch (e) {}
                }
            }
            ;
            function go(i) {
                alive++;
                cur = i;
                q.splice(0).forEach(x => x.res());
                clearInterval(gi);
                gsap.killTweensOf([S, F, I]);
                gsap.set(F, {
                    scaleY: 1,
                    rotation: 0
                });
                gsap.set(I, {
                    rotation: 0,
                    scaleY: 1,
                    y: 0
                });
                bob();
                ps = [];
                $("#fx").innerHTML = "";
                $("#eyes").style.display = "none";
                $("#stage").innerHTML = "";
                $("#lv").textContent = (i < 6 ? "Level " + (i + 1) + ": " : "") + T[i];
                $$(".lb").forEach( (d, k) => {
                    d.classList.toggle("on", k === i);
                    d.classList.toggle("done", k < i || i === 6)
                }
                );
                [intro, l1, l2, l3, l4, l5, end][i]()
            }
            async function win(me, msg) {
                boom(W() / 2, H() / 3, 90);
                jingle();
                jump();
                star();
                await say(msg);
                await wait(600);
                if (me === alive)
                    go(cur + 1)
            }
            /* Level 1: hello */
            function intro() {
                const me = alive;
                put(-200, H() * .8);
                run(W() * .3, H() * .8, 1.3).then( () => {
                    if (me === alive) {
                        jump();
                        say("Hello! What’s your name?")
                    }
                }
                );
                $("#stage").innerHTML = '<div class="card"><input id="nm" maxlength="14" placeholder="My name is…"><button class="big" id="go">Hello!</button></div>';
                $("#go").onclick = async () => {
                    tone(660);
                    name = $("#nm").value.trim() || "friend";
                    jump();
                    star();
                    await say("Nice to meet you, " + name + "!");
                    await wait(500);
                    if (me === alive)
                        go(1)
                }
            }
            /* Level 2: pop balloons */
            function l1() {
                const me = alive;
                put(W() * .12, H() - 60);
                say("Pop the balloons!", "Pop the balloons! Balloon!");
                let n = 0
                  , k = 0;
                const iv = setInterval( () => {
                    if (me !== alive)
                        return clearInterval(iv);
                    const c = N[k++ % 5]
                      , x = 60 + Math.random() * (W() - 200)
                      , b = bl(c, x, H() + 130);
                    gsap.to(b, {
                        y: -180,
                        duration: 6 + Math.random() * 3,
                        ease: "none",
                        onComplete: () => b.remove()
                    });
                    gsap.to(b, {
                        x: x + 40,
                        duration: 1.4,
                        yoyo: true,
                        repeat: -1,
                        ease: "sine.inOut"
                    });
                    b.onpointerdown = () => {
                        if (b.p)
                            return;
                        b.p = 1;
                        const r = b.getBoundingClientRect();
                        boom(r.left + 42, r.top + 50, 30);
                        tone(520 + n * 60, .15);
                        word(c + " balloon", r.left + 42, r.top, C[c]);
                        speak(c + " balloon", null, true);
                        gsap.killTweensOf(b);
                        b.remove();
                        jump();
                        if (++n >= 8) {
                            clearInterval(iv);
                            win(me, "Great job!")
                        }
                    }
                }
                , 850)
            }
            /* Level 3: touch the colour */
            function l2() {
                const me = alive;
                put(W() * .1, H() - 60);
                const bs = {};
                let r = 0
                  , tg = ""
                  , last = ""
                  , busy = true;
                const ask = () => {
                    if (me !== alive)
                        return;
                    do {
                        tg = rnd(N)
                    } while (tg === last);
                    last = tg;
                    sh(N).forEach( (c, i) => gsap.to(bs[c], {
                        x: rowX(i),
                        duration: .7,
                        ease: "back.inOut(1.5)"
                    }));
                    say("Touch the " + tg + " balloon!");
                    busy = false
                }
                ;
                N.forEach( (c, i) => {
                    const b = bs[c] = bl(c, rowX(i), H() * .5);
                    gsap.to(b, {
                        y: H() * .5 - 14,
                        duration: 1 + Math.random() * .5,
                        yoyo: true,
                        repeat: -1,
                        ease: "sine.inOut"
                    });
                    b.onpointerdown = async () => {
                        if (busy)
                            return;
                        if (c === tg) {
                            busy = true;
                            const q = b.getBoundingClientRect();
                            boom(q.left + 42, q.top + 50, 40);
                            tone(784);
                            jump();
                            star();
                            gsap.fromTo(b, {
                                scale: 1
                            }, {
                                scale: 1.4,
                                yoyo: true,
                                repeat: 1,
                                duration: .2
                            });
                            await say("Good job! " + c);
                            if (me !== alive)
                                return;
                            if (++r >= 6)
                                return win(me, "You are a star!");
                            await wait(400);
                            ask()
                        } else {
                            shake(b);
                            say("Try again!")
                        }
                    }
                }
                );
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = '<button class="big">🔊</button>';
                card.firstChild.onclick = () => tg && say("Touch the " + tg + " balloon!");
                $("#stage").appendChild(card);
                setTimeout(ask, 1300)
            }
            /* Level 4: what's missing */
            function l3() {
                const me = alive;
                put(W() * .1, H() - 60);
                let r = 0;
                const bs = {};
                N.forEach( (c, i) => bs[c] = bl(c, rowX(i), H() * .42));
                const rd = async () => {
                    if (me !== alive)
                        return;
                    const ms = rnd(N);
                    N.forEach(c => gsap.set(bs[c], {
                        opacity: 1,
                        scale: 1
                    }));
                    await say("Look at the balloons!");
                    await wait(1200);
                    if (me !== alive)
                        return;
                    N.forEach(c => gsap.to(bs[c], {
                        opacity: 0,
                        duration: .4
                    }));
                    $("#eyes").style.display = "block";
                    await say("Close your eyes!");
                    await wait(1500);
                    if (me !== alive)
                        return;
                    $("#eyes").style.display = "none";
                    N.forEach(c => c !== ms && gsap.to(bs[c], {
                        opacity: 1,
                        duration: .4
                    }));
                    say("Open your eyes! What’s missing?");
                    const ch = document.createElement("div");
                    ch.className = "chips";
                    $("#stage").appendChild(ch);
                    sh(N).forEach(c => {
                        const d = document.createElement("button");
                        d.className = "chip";
                        d.innerHTML = ball(c);
                        d.onpointerdown = async () => {
                            if (c === ms) {
                                ch.remove();
                                gsap.fromTo(bs[ms], {
                                    opacity: 1,
                                    scale: 0
                                }, {
                                    scale: 1.2,
                                    duration: .5,
                                    ease: "back.out(3)"
                                });
                                boom(rowX(N.indexOf(ms)) + 42, H() * .42, 50);
                                tone(784);
                                jump();
                                star();
                                await say("Yes! " + ms + "!");
                                if (me !== alive)
                                    return;
                                if (++r >= 3)
                                    return win(me, "Amazing!");
                                await wait(500);
                                rd()
                            } else {
                                shake(d);
                                say("Try again!")
                            }
                        }
                        ;
                        ch.appendChild(d)
                    }
                    )
                }
                ;
                rd()
            }
            /* Level 5: run to the colour */
            function l4() {
                const me = alive
                  , gy = () => H() - 70;
                put(W() / 2, gy());
                let r = 0
                  , tg = ""
                  , busy = true;
                const ask = () => {
                    if (me !== alive)
                        return;
                    tg = rnd(N);
                    say("Run to the " + tg + "!");
                    busy = false
                }
                ;
                N.forEach( (c, i) => {
                    const p = document.createElement("div");
                    p.className = "pad";
                    p.innerHTML = ball(c) + "<span>" + c + "</span>";
                    p.style.left = (i * 20 + 10) + "%";
                    $("#stage").appendChild(p);
                    gsap.set(p, {
                        xPercent: -50
                    });
                    p.onpointerdown = async () => {
                        if (busy)
                            return;
                        busy = true;
                        const x = (i + .5) * W() / 5;
                        await run(x, gy(), .8);
                        if (me !== alive)
                            return;
                        if (c === tg) {
                            tone(880);
                            rings(x, gy() - 100);
                            boom(x, gy() - 80, 40);
                            jump();
                            star();
                            await say("Super! " + c + "!");
                            if (me !== alive)
                                return;
                            if (++r >= 6)
                                return win(me, "You are so fast!");
                            await wait(400);
                            ask()
                        } else {
                            shake(p);
                            await say("Oops! " + tg + "!");
                            busy = false
                        }
                    }
                }
                );
                setTimeout(ask, 1300)
            }
            /* Level 6: climb to grey, black, white */
            function l5() {
                const me = alive
                  , gy = () => H() - 70
                  , xs = [.2, .5, .8].map(f => f * W())
                  , mh = Math.max(150, H() - 70 - 290)
                  , hp = sh([.55, .78, 1]).map(f => mh * f)
                  , order = sh(N2)
                  , bs = []
                  , ty = hp.map(h => gy() - h);
                put(W() * .5, gy());
                let r = 0
                  , tg = ""
                  , last = ""
                  , busy = true;
                const card = document.createElement("div");
                card.className = "card";
                card.style.display = "none";
                $("#stage").appendChild(card);
                const show = h => {
                    card.innerHTML = h;
                    card.style.display = h ? "" : "none"
                }
                ;
                async function climbY(to) {
                    const n = Math.max(2, Math.round(Math.abs(to - sy) / 55))
                      , dy = (to - sy) / n
                      , q = I.getBoundingClientRect();
                    word("Climb!", q.left + q.width / 2, q.top, "#8a5a2b");
                    for (let i = 0; i < n; i++) {
                        if (me !== alive)
                            return;
                        await new Promise(res => gsap.to(S, {
                            y: sy + dy,
                            duration: .3,
                            ease: "sine.inOut",
                            onComplete: () => {
                                sy += dy;
                                res()
                            }
                        }));
                        gsap.fromTo(F, {
                            rotation: i % 2 ? 10 : -10
                        }, {
                            rotation: 0,
                            duration: .3
                        });
                        chirp(450 + i * 35, 650 + i * 35, .08, "square", .05)
                    }
                }
                const down = () => {
                    chirp(900, 200, .6, "sine", .1);
                    return new Promise(res => gsap.to(S, {
                        y: gy(),
                        duration: .7,
                        ease: "power2.in",
                        onComplete: () => {
                            sy = gy();
                            res()
                        }
                    }))
                }
                ;
                const ask = () => {
                    if (me !== alive)
                        return;
                    do {
                        tg = rnd(N2)
                    } while (tg === last);
                    last = tg;
                    say("Climb to the " + tg + " balloon!");
                    busy = false
                }
                ;
                async function pick(i) {
                    if (busy)
                        return;
                    busy = true;
                    const c = order[i];
                    await run(xs[i], gy(), .6);
                    if (me !== alive)
                        return;
                    speak("Climb!", null, true);
                    await climbY(ty[i] + 8);
                    if (me !== alive)
                        return;
                    if (c === tg) {
                        const q = bs[i].getBoundingClientRect();
                        boom(q.left + 42, q.top + 50, 50);
                        rings(xs[i], ty[i] - 60);
                        tone(880);
                        jump();
                        star();
                        gsap.to(bs[i], {
                            scale: 0,
                            duration: .2
                        });
                        await say("Super! " + c + "!");
                        if (me !== alive)
                            return;
                        down();
                        if (++r >= 6)
                            return win(me, "You are a climber!");
                        gsap.fromTo(bs[i], {
                            scale: 0
                        }, {
                            scale: 1,
                            duration: .5,
                            delay: .6,
                            ease: "back.out(3)"
                        });
                        await wait(900);
                        ask()
                    } else {
                        shake(bs[i]);
                        await say("Oops! " + c + "!");
                        if (me !== alive)
                            return;
                        await down();
                        if (me !== alive)
                            return;
                        await say("Climb to the " + tg + " balloon!");
                        busy = false
                    }
                }
                order.forEach( (c, i) => {
                    const l = document.createElement("div");
                    l.className = "lad";
                    Object.assign(l.style, {
                        left: xs[i] - 31 + "px",
                        top: ty[i] + "px",
                        height: gy() - ty[i] + "px"
                    });
                    $("#stage").appendChild(l);
                    const b = bs[i] = bl(c, xs[i] - 42, ty[i] - 150);
                    gsap.to(b, {
                        y: ty[i] - 160,
                        duration: 1.2 + i * .2,
                        yoyo: true,
                        repeat: -1,
                        ease: "sine.inOut"
                    });
                    l.onpointerdown = b.onpointerdown = () => pick(i)
                }
                );
                (async () => {
                    await wait(500);
                    await say("Look! Grey, black, white!");
                    for (let i = 0; i < 3; i++) {
                        if (me !== alive)
                            return;
                        gsap.fromTo(bs[i], {
                            scale: 1
                        }, {
                            scale: 1.35,
                            yoyo: true,
                            repeat: 1,
                            duration: .25
                        });
                        await say("This is a " + order[i] + " balloon. " + order[i] + "!");
                        await wait(200)
                    }
                    if (me !== alive)
                        return;
                    await say("Climb! Let’s climb!");
                    await run(xs[1], gy(), .7);
                    if (me !== alive)
                        return;
                    show('<button class="big" id="cl">🧗 Climb!</button>');
                    let t = 0
                      , bz = false;
                    $("#cl").onclick = async () => {
                        if (bz)
                            return;
                        bz = true;
                        t++;
                        await climbY(Math.max(ty[1] + 8, sy - 120));
                        if (me !== alive)
                            return;
                        await say("Climb!");
                        bz = false;
                        if (t >= 4) {
                            show("");
                            await say("Climb down!");
                            await down();
                            if (me !== alive)
                                return;
                            show('<button class="big" id="rp">🔊</button>');
                            $("#rp").onclick = () => tg && say("Climb to the " + tg + " balloon!");
                            ask()
                        }
                    }
                }
                )()
            }
            /* Finale */
            function end() {
                const me = alive;
                put(W() / 2, H() * .72);
                gsap.to(F, {
                    scaleX: -1,
                    duration: .1
                });
                fc = -1;
                say("Bye-bye! Goodbye!");
                gsap.to(I, {
                    rotation: 6,
                    yoyo: true,
                    repeat: -1,
                    duration: .35
                });
                const iv = setInterval( () => {
                    if (me !== alive)
                        return clearInterval(iv);
                    boom(Math.random() * W(), H() * .5, 40);
                    tone(600 + Math.random() * 500, .1, "triangle")
                }
                , 800);
                $("#stage").innerHTML = '<div class="card end"><b id="wd"></b><span>⭐ ' + st + '</span><button class="big" id="ag">Play again</button></div>';
                $("#wd").textContent = "Well done, " + name + "!";
                $("#ag").onclick = () => {
                    st = 0;
                    $("#st").textContent = 0;
                    go(0)
                }
            }
            /* parallax and clouds */
            for (let i = 0; i < 4; i++) {
                const c = document.createElement("div");
                c.className = "cl";
                c.style.cssText = "top:" + (6 + i * 10) + "%;width:" + (160 + i * 40) + "px;height:" + (50 + i * 10) + "px;opacity:" + (.22 + i * .05);
                $("#sky").appendChild(c);
                gsap.fromTo(c, {
                    x: -300
                }, {
                    x: W() + 300,
                    duration: 34 + i * 9,
                    repeat: -1,
                    ease: "none",
                    delay: -i * 9
                })
            }
            gsap.to("#bg", {
                scale: 1.05,
                duration: 12,
                yoyo: true,
                repeat: -1,
                ease: "sine.inOut"
            });
            addEventListener("pointermove", e => {
                const a = e.clientX / W() - .5
                  , b = e.clientY / H() - .5;
                gsap.to("#bg", {
                    x: -a * 40,
                    y: -b * 26,
                    duration: 1
                });
                gsap.to("#sky", {
                    x: -a * 80,
                    y: -b * 40,
                    duration: 1.2
                })
            }
            );
            $("#play").onclick = () => {
                try {
                    ctx().resume();
                    speechSynthesis.speak(new SpeechSynthesisUtterance(""))
                } catch (e) {}
                $("#start").remove();
                go(0)
            }
            ;
        </script>
    </body>
</html>
